[project]
name = "podpack-demo"
version = "0.2.0"
description = "A podpack site, built by following creating-a-site.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENCE"]
dependencies = ["podpack", "podpack-notes"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "podpack_demo"

[tool.uv.sources]
podpack = { git = "https://github.com/holdenweb/podpack.git" }
podpack-notes = { git = "https://github.com/holdenweb/podpack-notes.git" }
