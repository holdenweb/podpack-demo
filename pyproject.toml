[project]
name = "podpack-demo"
version = "0.2.0"
description = "A podpack site, built by following creating-a-site.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENCE"]
keywords = ["flask", "plugins", "web", "containers", "podman"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = ["podpack>=0.9.1", "podpack-notes>=0.1.4"]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "podpack_demo"

[tool.uv.sources]
podpack = { git = "https://github.com/holdenweb/podpack.git", rev = "r0.9.1" }
# podpack-notes is not here on purpose. It publishes to PyPI now, so naming no
# source is what sends uv there for it, and the version above is the whole pin.
# podpack does not, which is why it still names a tag on a git URL.
